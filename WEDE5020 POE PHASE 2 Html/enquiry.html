<!DOCTYPE html>
<html lang="en">
<head>\
    <link rel="stylesheet" href="css.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Labs | Product Enquiry</title>
  
</head>
<body>
    <header>
        <div class="logo">RS LABS</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Product & Order Enquiry</h1>
        <p>Have questions regarding custom orders, wholesale pricing, or product specifications? Submit your inquiry below.</p>

        <form action="#" method="post">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="product-type">Product Interest:</label><br>
            <select id="product-type" name="product-type">
                <option value="compression">Compression Wear</option>
                <option value="shorts">Training Shorts</option>
                <option value="outerwear">Hoodies & Outerwear</option>
                <option value="wholesale">Bulk / Wholesale Orders</option>
            </select><br><br>

            <label for="message">Enquiry Details:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br><br>

            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 RS Labs. All rights reserved.</p>
    </footer>
</body>
</html>
